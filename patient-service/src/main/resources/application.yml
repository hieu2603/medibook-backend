spring:
  application:
    name: patient-service

  datasource:
    url: jdbc:postgresql://postgres:5432/patient_service
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    web:
      pageable:
        default-page-size: 10
        one-indexed-parameters: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8084