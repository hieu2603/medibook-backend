server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
            allowedHeaders:
              - "*"
            allowCredentials: true
      
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthFilter

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**, /api/balance/**
          filters:
            - JwtAuthFilter

        - id: clinic-service
          uri: http://clinic-service:8083
          predicates:
            - Path=/api/clinics/**, /api/doctors/**, /api/specialties/**, /api/reviews/**, /api/clinic-registrations/**
          filters:
            - JwtAuthFilter

        - id: patient-service
          uri: http://patient-service:8084
          predicates:
            - Path=/api/patients/**
          filters:
            - JwtAuthFilter

        - id: appointment-service
          uri: http://appointment-service:8085
          predicates:
            - Path=/api/appointments/**
          filters:
            - JwtAuthFilter

#        - id: chat-service
#          uri: http://localhost:8084
#          predicates:
#            - Path=/api/messages/**
#          filters:
#            - JwtAuthFilter

jwt:
  secret: cccd758191545e6c7a6fbe10154ec9a743ecedb4f2b80ee6294fb852b7e08b68
  expiration: 7200000 # 2h

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

gateway:
  public-routes:
    - path: /api/auth/**
      methods: [ POST ]
    - path: /api/users/**
      methods: [ POST ]
    - path: /api/balance/**
      methods: [ POST ]
    - path: /api/clinics
      methods: [ GET, POST ]
    - path: /api/clinic-registrations/**
      methods: [ GET, POST, PATCH ]
    - path: /api/clinics/{id}
      methods: [ GET ]
    - path: /api/clinics/images/{clinicId}
      methods: [ GET ]
    - path: /api/doctors/**
      methods: [ GET ]
    - path: /api/specialties/**
      methods: [ GET ]
    - path: /api/patients/**
      methods: [ GET, POST ]
    - path: /api/reviews/**
      methods: [ GET, POST, DELETE ]
    - path: /api/appointments/**
      methods: [ GET, POST, PUT, PATCH ]